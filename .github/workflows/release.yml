# Push a tag such as v0.2.0 to publish a release with vendor.zip attached.
# The app downloads this asset on first run and during updates.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, pdo, sqlite3, dom, fileinfo
      - name: Check VERSION matches the tag
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-scripts
      - name: Build vendor.zip
        run: |
          sha1sum composer.lock | cut -d' ' -f1 > vendor/.cms-lock
          zip -qr vendor.zip vendor
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vendor.zip --generate-notes
